name: Something doesn't work
description: A button, page or calculation behaves wrongly
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone / computer and browser
      placeholder: "e.g. iPhone Safari, Windows Chrome"
